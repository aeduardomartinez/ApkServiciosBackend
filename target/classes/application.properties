spring.application.name=streaming

# Usa variables de entorno para producción, local usa los valores por defecto
spring.r2dbc.url=${DB_URL:r2dbc:postgresql://localhost:5432/streaming_db}
spring.r2dbc.username=${DB_USER:postgres}
spring.r2dbc.password=${DB_PASSWORD:123}

# Inicializaci�n autom�tica del esquema (opcional si usas docker-entrypoint)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=50
spring.r2dbc.pool.max-idle-time=15m
spring.r2dbc.pool.validation-query=SELECT 1
# Detección de fugas de conexión (si una conexión no se libera en 20s, loguea)
# spring.r2dbc.pool.max-life-time=30m

# Para depurar la SQL enviada
logging.level.org.springframework.r2dbc=DEBUG
logging.level.io.r2dbc.postgresql=TRACE
logging.level.org.springframework.data.r2dbc=DEBUG


